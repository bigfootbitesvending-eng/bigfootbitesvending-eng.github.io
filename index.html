<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reorder Coverage — Bigfoot Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  /* Page-specific component styles. Colors/fonts reference the shared
     tokens from /shared/styles.css rather than redefining a palette. */
  :root {
    --danger: #B3492D;
    --danger-soft: #F5E4DE;
  }

  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
  }

  header {
    max-width: 820px;
    margin: 0 auto 2rem;
    padding: 0 1.25rem 1rem;
    border-bottom: 2px solid var(--ink);
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .panel {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 6px;
    margin-bottom: 1.5rem;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid var(--rule);
  }

  .panel-header h2 {
    font-size: 1rem;
  }

  #search {
    font-family: var(--font-body);
    font-size: 0.88rem;
    padding: 0.45rem 0.7rem;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
    width: 220px;
    max-width: 45vw;
  }
  #search:focus {
    outline: 2px solid var(--ledger-green);
    outline-offset: 1px;
  }

  button {
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 500;
    border-radius: 4px;
    border: 1px solid transparent;
    padding: 0.4rem 0.75rem;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.85; }
  button:focus-visible {
    outline: 2px solid var(--ledger-green);
    outline-offset: 2px;
  }

  .btn-primary { background: var(--ledger-green); color: #fff; }
  .btn-quiet { background: transparent; color: var(--ink-soft); border-color: var(--rule); }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--rule);
  }

  th.num, td.num { text-align: right; }

  tbody td {
    padding: 0.65rem 1rem;
    border-bottom: 1px solid var(--rule);
    font-size: 0.9rem;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.editing { background: var(--ledger-green-soft); }

  .coverage-value {
    font-family: 'IBM Plex Mono', monospace;
  }

  .coverage-input {
    width: 70px;
    font-family: 'IBM Plex Mono', monospace;
    text-align: right;
    font-size: 0.9rem;
    padding: 0.35rem 0.5rem;
    border: 1px solid var(--rule);
    border-radius: 4px;
  }
  .coverage-input:focus {
    outline: 2px solid var(--ledger-green);
    outline-offset: 1px;
  }
  .coverage-input.invalid {
    border-color: var(--danger);
  }

  td.actions {
    text-align: right;
    white-space: nowrap;
  }
  td.actions button + button { margin-left: 0.4rem; }

  .row-error {
    color: var(--danger);
    font-size: 0.78rem;
    margin-top: 0.3rem;
    display: block;
  }

  .empty-state {
    padding: 2.5rem 1.1rem;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }
  .empty-state strong {
    display: block;
    color: var(--ink);
    margin-bottom: 0.3rem;
    font-size: 0.95rem;
  }

  #status-line {
    font-size: 0.85rem;
    color: var(--ink-soft);
    min-height: 1.2em;
  }
  #status-line.error { color: var(--danger); }

  @media (max-width: 640px) {
    thead { display: none; }
    tbody tr { display: block; border-bottom: 2px solid var(--rule); }
    tbody td { display: flex; justify-content: space-between; align-items: center; border-bottom: none; padding: 0.5rem 1rem; }
    tbody td::before { content: attr(data-label); font-size: 0.72rem; text-transform: uppercase; color: var(--ink-soft); }
    td.actions { justify-content: flex-end; }
    td.actions::before { content: none; }
    .panel-header { flex-direction: column; align-items: stretch; }
    #search { width: 100%; max-width: none; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1>Reorder Coverage</h1>
  <div class="subtitle">Basement Inventory — days of stock to keep on hand per SKU when reordering from suppliers</div>
</header>

<main>
  <section class="panel">
    <div class="panel-header">
      <h2>SKUs</h2>
      <input type="text" id="search" placeholder="Search product name or UPC…">
    </div>

    <table id="coverage-table" style="display:none;">
      <thead>
        <tr>
          <th>Product</th>
          <th>Pick Category</th>
          <th>UPC</th>
          <th class="num" style="min-width:130px;">Reorder Coverage</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="coverage-body"></tbody>
    </table>

    <div class="empty-state" id="empty-state" style="display:none;">
      <strong>No matching SKUs</strong>
      Try a different search term, or clear the search to see everything.
    </div>
  </section>

  <div id="status-line"></div>
</main>

<script src="/shared/config.js"></script>
<script>
  // Single endpoint: GET to read all SKUs, POST { upc, reorder_coverage_days }
  // to update one. No create/delete here — Add Product owns row creation
  // and defaults new SKUs to the 21-day system default already.
  const API_BASE = 'https://randysmith42.app.n8n.cloud/webhook/reorder-coverage';

  const DEFAULT_DAYS = 21;

  let rows = [];
  let filtered = [];
  let editingUpc = null;
  let searchTerm = '';

  const tableEl = document.getElementById('coverage-table');
  const bodyEl = document.getElementById('coverage-body');
  const emptyEl = document.getElementById('empty-state');
  const statusEl = document.getElementById('status-line');
  const searchEl = document.getElementById('search');

  function setStatus(message, isError) {
    statusEl.textContent = message || '';
    statusEl.className = isError ? 'error' : '';
  }

  async function loadRows() {
    setStatus('Loading…');
    try {
      const res = await fetch(API_BASE, { method: 'GET', headers: { 'X-API-Key': API_KEY } });
      if (!res.ok) throw new Error('Server returned ' + res.status);
      rows = await res.json();
      rows.sort((a, b) => a.product_name.localeCompare(b.product_name));
      applyFilter();
      setStatus('');
    } catch (err) {
      setStatus('Could not load SKUs — ' + err.message, true);
    }
  }

  function applyFilter() {
    const term = searchTerm.trim().toLowerCase();
    filtered = !term
      ? rows
      : rows.filter(r =>
          r.product_name.toLowerCase().includes(term) ||
          r.upc.includes(term)
        );
    render();
  }

  searchEl.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    applyFilter();
  });

  function render() {
    if (!filtered.length) {
      tableEl.style.display = 'none';
      emptyEl.style.display = 'block';
      return;
    }
    tableEl.style.display = 'table';
    emptyEl.style.display = 'none';
    bodyEl.innerHTML = '';

    filtered.forEach(row => {
      const tr = document.createElement('tr');
      if (editingUpc === row.upc) {
        tr.classList.add('editing');
        tr.appendChild(td('Product', row.product_name));
        tr.appendChild(td('Pick Category', row.pick_category || '—'));
        tr.appendChild(td('UPC', row.upc));
        tr.appendChild(editableCoverageCell(row));
        tr.appendChild(editActionsCell(row));
      } else {
        tr.appendChild(td('Product', row.product_name));
        tr.appendChild(td('Pick Category', row.pick_category || '—'));
        tr.appendChild(td('UPC', row.upc));
        tr.appendChild(viewCoverageCell(row));
        tr.appendChild(viewActionsCell(row));
      }
      bodyEl.appendChild(tr);
    });
  }

  function td(label, text) {
    const cell = document.createElement('td');
    cell.dataset.label = label;
    cell.textContent = text;
    return cell;
  }

  function viewCoverageCell(row) {
    const cell = document.createElement('td');
    cell.dataset.label = 'Reorder Coverage';
    cell.className = 'num';
    const span = document.createElement('span');
    span.className = 'coverage-value';
    span.textContent = row.reorder_coverage_days + ' days';
    cell.appendChild(span);
    return cell;
  }

  function editableCoverageCell(row) {
    const cell = document.createElement('td');
    cell.dataset.label = 'Reorder Coverage';
    cell.className = 'num';
    const input = document.createElement('input');
    input.type = 'number';
    input.step = '1';
    input.className = 'coverage-input';
    input.id = 'edit-coverage-' + row.upc;
    input.value = row.reorder_coverage_days;
    cell.appendChild(input);
    return cell;
  }

  function viewActionsCell(row) {
    const cell = document.createElement('td');
    cell.className = 'actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-quiet';
    editBtn.textContent = 'Edit';
    editBtn.onclick = () => { editingUpc = row.upc; render(); };
    cell.appendChild(editBtn);
    return cell;
  }

  function editActionsCell(row) {
    const cell = document.createElement('td');
    cell.className = 'actions';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-primary';
    saveBtn.textContent = 'Save';
    saveBtn.onclick = () => saveRow(row);
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-quiet';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => { editingUpc = null; render(); };
    cell.appendChild(saveBtn);
    cell.appendChild(cancelBtn);
    return cell;
  }

  async function saveRow(row) {
    const input = document.getElementById('edit-coverage-' + row.upc);
    const raw = input.value.trim();

    // Read the raw string ourselves rather than trusting the number
    // input's own value/coercion — some browsers silently clamp or
    // blank an out-of-range value on blur (which fires right before
    // this click handler runs), which would let a bad value slip
    // past a check that only looked at input.valueAsNumber.
    const isWholeNumber = /^-?\d+$/.test(raw);
    const value = isWholeNumber ? parseInt(raw, 10) : NaN;

    if (raw === '' || !isWholeNumber || value <= 0) {
      input.classList.add('invalid');
      setStatus('Reorder coverage must be a whole number greater than zero.', true);
      return;
    }
    input.classList.remove('invalid');

    setStatus('Saving…');
    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
        body: JSON.stringify({ upc: row.upc, reorder_coverage_days: value })
      });
      const body = await res.json();
      if (!res.ok) {
        const detail = (body && (body.details || body.error)) || ('Server returned ' + res.status);
        throw new Error(Array.isArray(detail) ? detail.join(' ') : detail);
      }
      editingUpc = null;
      await loadRows();
      setStatus('Saved.');
    } catch (err) {
      setStatus('Could not save — ' + err.message, true);
    }
  }

  loadRows();
</script>
</body>
</html>
